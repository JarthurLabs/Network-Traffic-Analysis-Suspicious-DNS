name: Validate packet evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packet-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install TShark
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Validate capture integrity
        run: python -m unittest discover -s tests -v
      - name: Recreate packet tables
        run: bash scripts/analyze_pcap.sh
      - name: Upload genuine TShark output
        uses: actions/upload-artifact@v6
        with:
          name: tshark-output
          path: tool-output/generated/
          if-no-files-found: error
